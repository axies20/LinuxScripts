# Minimal development-oriented Starship prompt for Fedora/.NET/Aspire.
# Nerd Font glyphs require a Nerd Font to be selected in the terminal profile.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000

format = """\
$directory\
$git_branch\
$git_status\
$dotnet\
$golang\
$nodejs\
$python\
$php\
$rust\
$container\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = false
read_only = " 󰌾"

[git_branch]
format = " [$symbol$branch]($style)"
symbol = " "

[git_status]
format = "([$all_status$ahead_behind]($style))"

[dotnet]
format = " [$symbol$version]($style)"
symbol = " "

[golang]
format = " [$symbol$version]($style)"
symbol = " "

[nodejs]
format = " [$symbol$version]($style)"
symbol = " "

[python]
format = " [$symbol$version]($style)"
symbol = " "

[php]
format = " [$symbol$version]($style)"
symbol = " "

[rust]
format = " [$symbol$version]($style)"
symbol = "󱘗 "

[container]
format = " [$symbol$name]($style)"
symbol = " "

[cmd_duration]
min_time = 2000
format = " [󱎫 $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
