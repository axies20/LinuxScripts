"$schema" = "https://starship.rs/config-schema.json"

# Отделять новый prompt пустой строкой.
add_newline = true

# Основной prompt.
#
#  dark Fedora
#       ↓
#  blue directory
#       ↓
#  yellow Git
#
format = """
$os\
$username\
$hostname\
$container\
$sudo\
$jobs\
$shlvl\
[](fg:#292b31 bg:#1e78e4)\
$directory\
([](fg:#1e78e4 bg:#f2c811)\
$git_branch\
$git_state\
$git_status\
[](fg:#f2c811))\
${custom.directory_tail}\
$character"""

# Правая часть.
# status появляется только после ошибки.
# cmd_duration — только если команда выполнялась достаточно долго.
right_format = """
$package\
$dotnet\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$azure\
${custom.duration_success}\
${custom.duration_error}\
$battery"""


# ------------------------------------------------------------
# Fedora / OS
# ------------------------------------------------------------

[os]
disabled = false
style = "fg:#f5f5f5 bg:#292b31"
format = "[ $symbol ]($style)"

[os.symbols]
Fedora = " "
Linux = " "


# ------------------------------------------------------------
# SSH host
# ------------------------------------------------------------

# Имя пользователя и хоста показываются только в SSH-сессии.
[username]
show_always = false
style_user = "bold fg:#f5f5f5 bg:#292b31"
style_root = "bold fg:#ff6b6b bg:#292b31"
format = "[ 󰢹 $user]($style)"

[hostname]
ssh_only = true
style = "bold fg:#f5f5f5 bg:#292b31"
format = "[@$hostname ]($style)"
trim_at = "."


# ------------------------------------------------------------
# Directory
# ------------------------------------------------------------

[directory]
style = "bold fg:#f5f5f5 bg:#1e78e4"

# Иконка папки + путь.
format = "[   $path ]($style)"

# ~/R/BrokerTaxReport вместо слишком длинного полного пути.
truncation_length = 4
truncate_to_repo = false

# Если путь обрезан:
# ~/very/long/project -> …/long/project
truncation_symbol = "…/"

home_symbol = "~"

read_only = " "

# Острый синий край, когда жёлтый Git-блок отсутствует.
[custom.directory_tail]
when = '''! git rev-parse --is-inside-work-tree >/dev/null 2>&1'''
command = "printf tail"
format = "[](fg:#1e78e4)"

# ------------------------------------------------------------
# Git branch
# ------------------------------------------------------------

[git_branch]

# Как у тебя сейчас:
#    dev
symbol = "  "

style = "bold fg:#252525 bg:#f2c811"

format = "[ $symbol $branch ]($style)"

truncation_length = 32
truncation_symbol = "…"


# ------------------------------------------------------------
# Git operation in progress
# ------------------------------------------------------------

[git_state]
disabled = false
style = "bold fg:#252525 bg:#f2c811"
format = "[ $state( $progress_current/$progress_total) ]($style)"
rebase = "󰑓 REBASE"
merge = "󰘬 MERGE"
revert = "󰕌 REVERT"
cherry_pick = "󰊢 CHERRY-PICK"
bisect = "󰇘 BISECT"
am = "󰶍 AM"
am_or_rebase = "󰑓 AM/REBASE"


# ------------------------------------------------------------
# Git status
# ------------------------------------------------------------

[git_status]
style = "bold fg:#252525 bg:#f2c811"

# Не добавляем [], просто:
#
# dev !5 ?3
#
format = "[$all_status$ahead_behind]($style)"

# Файлы с конфликтами
conflicted = "=${count} "

# Изменённые файлы
modified = "!${count} "

# Новые / untracked
untracked = "?${count} "

# Добавленные в index
staged = "+${count} "

# Удалённые
deleted = "-${count} "

# Переименованные
renamed = "»${count} "

# Stash
stashed = "*${count} "

# Git ahead / behind
ahead = "⇡${count} "
behind = "⇣${count} "

diverged = "⇕⇡${ahead_count}⇣${behind_count} "

# Ничего не показываем, если всё синхронизировано.
up_to_date = ""


# ------------------------------------------------------------
# Prompt character
# ------------------------------------------------------------

[character]

# У тебя роль prompt фактически выполняет Powerline-стрелка выше,
# поэтому отдельный ❯ нам не нужен.
success_symbol = ""
error_symbol = ""

# Vim mode тоже не рисуем отдельными символами.
vimcmd_symbol = ""
vimcmd_replace_one_symbol = ""
vimcmd_replace_symbol = ""
vimcmd_visual_symbol = ""


# ------------------------------------------------------------
# Exit status — справа
# ------------------------------------------------------------

[status]

# По умолчанию этот модуль выключен в Starship.
disabled = false

# При успешной команде вообще ничего не показываем.
success_symbol = ""

# Для ошибки показываем только значок, без числового exit code.
symbol = "✕"

format = "[](fg:#d92d3a)[ $symbol ](bold fg:#ffffff bg:#d92d3a)"

# Не заменять код 255 названием ошибки.
map_symbol = false

# Для сигналов тоже стараемся сохранить числовое значение.
recognize_signal_code = true


# ------------------------------------------------------------
# Command duration — справа
# ------------------------------------------------------------

[cmd_duration]

disabled = false

# Показывать только команды дольше 2 секунд.
min_time = 2000

show_milliseconds = false

# Зелёный Powerline-хвост справа: 3s, 2m 10s и т. п.
format = "[](fg:#2ea043)[ $duration ](bold fg:#ffffff bg:#2ea043)"

[custom.duration_success]
when = '''test "${STARSHIP_TAIL_DURATION:-0}" -ge 2000 && test "${STARSHIP_TAIL_STATUS:-0}" -eq 0'''
command = '''seconds=$((${STARSHIP_TAIL_DURATION:-0} / 1000)); if [ "$seconds" -ge 60 ]; then printf '%dm %ds' "$((seconds / 60))" "$((seconds % 60))"; else printf '%ds' "$seconds"; fi'''
format = "[](fg:#2ea043)[ $output ](bold fg:#ffffff bg:#2ea043)"

[custom.duration_error]
when = '''test "${STARSHIP_TAIL_DURATION:-0}" -ge 2000 && test "${STARSHIP_TAIL_STATUS:-0}" -ne 0'''
command = '''seconds=$((${STARSHIP_TAIL_DURATION:-0} / 1000)); if [ "$seconds" -ge 60 ]; then printf '%dm %ds' "$((seconds / 60))" "$((seconds % 60))"; else printf '%ds' "$seconds"; fi'''
format = "[](fg:#d92d3a)[ $output ✕ ](bold fg:#ffffff bg:#d92d3a)"


# ------------------------------------------------------------
# Situational shell indicators
# ------------------------------------------------------------

[container]
disabled = false
symbol = "󰆍"
style = "bold fg:#ffcc66 bg:#292b31"
format = "[ $symbol $name ]($style)"

[sudo]
disabled = false
symbol = "󰌾"
style = "bold fg:#ff6b6b bg:#292b31"
format = "[ $symbol ]($style)"

[jobs]
disabled = false
symbol = "󰒍"
style = "bold fg:#7dcfff bg:#292b31"
number_threshold = 1
symbol_threshold = 1
format = "[ $symbol $number ]($style)"

[shlvl]
disabled = false
threshold = 2
symbol = "󰞷"
style = "bold fg:#bb9af7 bg:#292b31"
format = "[ $symbol $shlvl ]($style)"


# ------------------------------------------------------------
# Low battery warning — right side
# ------------------------------------------------------------

[battery]
disabled = false
format = "[ $symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold #ff6b6b"


# ------------------------------------------------------------
# Контекст проекта и окружения — справа
# ------------------------------------------------------------
#
# Каждый модуль появляется только в подходящем проекте или при
# активном контексте. Короткие форматы не перегружают prompt.

[package]
disabled = false
symbol = "󰏗 "
format = "[$symbol$version](bold #c099ff) "

[dotnet]
disabled = false
symbol = "󰪮 "
format = "[$symbol$version](bold #9b7ede) "

[nodejs]
disabled = false
symbol = "󰎙 "
format = "[$symbol$version](bold #68a063) "

[python]
disabled = false
symbol = "󰌠 "
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )](bold #ffd43b)"

[rust]
disabled = false
symbol = "󱘗 "
format = "[$symbol$version](bold #dea584) "

[golang]
disabled = false
symbol = "󰟓 "
format = "[$symbol$version](bold #00add8) "

[docker_context]
disabled = false
symbol = "󰡨 "
format = "[$symbol$context](bold #2496ed) "
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[$symbol$context( \\($namespace\\))](bold #326ce5) "

[aws]
disabled = false
symbol = "󰸏 "
format = "[$symbol($profile )(\\[$region\\] )](bold #ff9900)"

[gcloud]
disabled = false
symbol = "󱇶 "
format = "[$symbol$account(@$domain)(\\($project\\))](bold #4285f4) "

[azure]
disabled = false
symbol = "󰠅 "
format = "[$symbol($subscription)](bold #0089d6) "
